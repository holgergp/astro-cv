name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Started by the Update Screenshots workflow after it pushes new baselines
  workflow_dispatch:
jobs:
  # The container image must match the installed @playwright/test version,
  # so read it from package.json instead of pinning it here
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright-version
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Browsers and their system dependencies are preinstalled, so no apt
    # downloads (a slow Ubuntu mirror once stalled `playwright install --with-deps`)
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build App
        run: npm run build
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
